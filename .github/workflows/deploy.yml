name: 🚀 Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            set +e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:$PATH
            
            echo "=== Starting Outset Studio Backend Deploy ==="
            cd /var/www/outsetStudio_admin
            git fetch origin main
            git reset --hard origin/main
            
            echo "PORT=3005" > .env
            echo "SESSION_SECRET=outsetstudio_admin_secret_key_2024" >> .env
            echo "ADMIN_EMAIL=admin@outsetstudio.in" >> .env
            echo "ADMIN_PASSWORD=admin123" >> .env
            
            npm ci --production
            chmod -R 755 /var/www/outsetStudio_admin
            
            pm2 startup systemd -u $USER --hp $HOME 2>/dev/null || true
            
            pm2 delete admin-outsetstudio 2>/dev/null || true
            pm2 start server.js --name "admin-outsetstudio"
            pm2 save || true
            
            pm2 status
            echo "=== Outset Studio Backend Deploy Complete ==="
